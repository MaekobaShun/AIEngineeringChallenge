[project]
name = "datastel-rag"
version = "0.1.0"
description = "Agentic RAG pipeline for the AI Engineering Challenge (data-astel fictional consulting firm)"
readme = "README.md"
authors = [
    { name = "MaekobaShun", email = "maekoba.shun.job@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "claude-agent-sdk>=0.2.134",
    "fugashi>=1.5.2",
    "google-genai>=2.17.0",
    "lxml>=6.1.1",
    "msoffcrypto-tool>=6.0.0",
    "nbformat>=5.11.0",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
    "tiktoken>=0.13.0",
    "tqdm>=4.70.0",
    "unidic-lite>=1.0.8",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "datastel_rag"
